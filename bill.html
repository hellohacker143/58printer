<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Receipt</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:12px;color:#111;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:#fff;padding:8px 0}.actions button{border:0;border-radius:8px;padding:12px;font-weight:700;color:#fff;background:#087f5b}.actions .close{background:#68736f}.bill{max-width:760px;margin:auto;padding:8px}h2{text-align:center;font-size:30px;margin:12px 0}hr{border:0;border-top:3px dashed;margin:12px 0}table{width:100%;border-collapse:collapse;font-weight:700}th,td{text-align:left;padding:8px 2px;overflow-wrap:anywhere}th:nth-child(n+3),td:nth-child(n+3){text-align:right}.row{display:flex;justify-content:space-between;gap:8px;margin:12px 0;font-size:20px;font-weight:700}.thanks{text-align:center;font-size:24px;font-weight:700;line-height:1.5}@media print{@page{size:58mm auto;margin:0}body{width:58mm;padding:2mm}.actions{display:none}.bill{padding:1mm}h2{font-size:15pt}th,td{font-size:8pt;padding:2mm 0}.row{font-size:9pt;margin:3mm 0}.thanks{font-size:10pt}hr{border-top:1px dashed;margin:3mm 0}}
</style></head><body><div class="actions"><button onclick="location.href='index.html'">⌂ HOME</button><button onclick="window.print()">🖨️ Print 58mm Receipt</button><button class="close" onclick="history.length>1?history.back():location.href='index.html'">Close</button></div><main class="bill" id="bill"></main>
<script>
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
try{const params=new URLSearchParams(location.search),data=JSON.parse(decodeURIComponent(params.get('data')||''));const items=Array.isArray(data.items)?data.items:[];const subtotal=items.reduce((s,p)=>s+Number(p.rate)*Number(p.qty),0);const discount=Number(data.discount)||0;const total=Math.max(0,subtotal-discount);document.title=(data.shop||'Shop')+' — Bill';document.getElementById('bill').innerHTML='<h2>'+escapeHtml(data.shop||'SAI KIRANA STORE')+'</h2><hr><table><thead><tr><th>NO</th><th>ITEM</th><th>QTY</th><th>RATE</th><th>AMOUNT</th></tr></thead><tbody>'+items.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+escapeHtml(p.name)+'</td><td>'+Number(p.qty)+'</td><td>'+money(p.rate)+'</td><td>'+money(Number(p.rate)*Number(p.qty))+'</td></tr>').join('')+'</tbody></table><hr><div class="row"><span>SUBTOTAL</span><span>'+money(subtotal)+'</span></div><div class="row"><span>DISCOUNT</span><span>'+money(discount)+'</span></div><div class="row"><span>GRAND TOTAL</span><span>'+money(total)+'</span></div><hr><div class="thanks">THANK YOU!<br>VISIT AGAIN</div><hr><p style="text-align:center">QUALITY PRODUCTS | BETTER PRICES</p>';function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}}catch(e){document.getElementById('bill').innerHTML='<h2>Bill URL is missing or invalid</h2><p>Return to the billing page and tap Preview Bill in New Tab again.</p>'}
</script></body></html>
